name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # One step, on purpose.
      #
      # This workflow used to list the checks it ran by hand. The list stopped
      # being updated on 2026-08-23 while `npm run verify` kept growing, and by
      # the time anyone compared them CI ran 10 of verify's 25 checks and skipped
      # 15. The skipped ones included check:api, check:seam and check:mcp, so the
      # MCP server had never been tested on Linux, and a pull request could merge
      # with the engine/payload seam leaking again while CI stayed green.
      #
      # Running verify itself makes CI and a local run the same gate by
      # construction: a check added to package.json is enforced here the moment
      # it lands, with nothing to remember. The cost is one step in the Actions UI
      # instead of many. The log still names the failing check, because each one
      # prints its own pass or fail line before the chain stops.
      #
      # Among what this includes, test:fixture runs the engine against a second,
      # deliberately unlike-2one payload and asserts none of 2one's data appears
      # in its output. Running against 2one alone cannot detect a 2one-shaped
      # assumption, because that run succeeds either way.
      - name: Verify (the same gate as npm run verify locally)
        run: npm run verify
