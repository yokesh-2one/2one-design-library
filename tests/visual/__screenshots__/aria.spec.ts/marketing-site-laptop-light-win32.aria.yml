  - paragraph: The building blocks and the guardrails, in one place.
  - heading "Real components" [level=3]
  - paragraph: /\d+ shadcn\/ui primitives re-skinned to the 2one tokens, not screenshots\./
  - heading "One token system" [level=3]
  - paragraph: Grayscale by design. Change a token in one place and every screen follows.
  - heading "Accessible by default" [level=3]
  - paragraph: Radix primitives and an APCA contrast audit that runs on every change.
  - heading "Light + dark" [level=3]
  - paragraph: Two audited themes ship together, with no third palette to maintain.
  - heading "AI-legible" [level=3]
  - paragraph: A manifest, knowledge graph and rules so any AI builds on-brand, first try.
  - heading "Impact analysis" [level=3]
  - paragraph: Ask what a token change touches before you ship it. Change-safety at scale.
  - heading "Build products that look like they belong together." [level=2]
  - paragraph: Start with the free tier — the full component set, both themes, no card required.
