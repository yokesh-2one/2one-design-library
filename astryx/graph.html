<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2one × Astryx — Knowledge Graph</title>
<style>
  :root{
    --bg:#ffffff; --panel:#fafafa; --line:#e7e7ea; --line-2:#d4d4d8; --ink:#09090b; --ink-2:#52525b; --ink-3:#8a8a92;
    --edge:#d4d4d8; --edge-hi:#09090b; --node-stroke:#ffffff; --chip:#f4f4f5; --sel:#09090b; --ok:#15803d; --bad:#dc2626;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0a0a0b; --panel:#141416; --line:#26262a; --line-2:#3f3f46; --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#6b6b73;
      --edge:#2c2c31; --edge-hi:#f4f4f5; --node-stroke:#0a0a0b; --chip:#1c1c20; --sel:#fafafa; --ok:#4ade80; --bad:#f87171; }
  }
  :root[data-theme="light"]{ --bg:#ffffff; --panel:#fafafa; --line:#e7e7ea; --line-2:#d4d4d8; --ink:#09090b; --ink-2:#52525b; --ink-3:#8a8a92; --edge:#d4d4d8; --edge-hi:#09090b; --node-stroke:#ffffff; --chip:#f4f4f5; --sel:#09090b; --ok:#15803d; --bad:#dc2626; }
  :root[data-theme="dark"]{ --bg:#0a0a0b; --panel:#141416; --line:#26262a; --line-2:#3f3f46; --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#6b6b73; --edge:#2c2c31; --edge-hi:#f4f4f5; --node-stroke:#0a0a0b; --chip:#1c1c20; --sel:#fafafa; --ok:#4ade80; --bad:#f87171; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  body{display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg);z-index:5}
  .back{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .back:hover{border-color:var(--line-2);color:var(--ink)}
  .title{font-weight:700;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
  .title .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}
  .stats{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .grow{flex:1}
  input.search{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:13px;font-family:var(--mono);width:170px}
  input.search:focus{outline:2px solid var(--sel);outline-offset:1px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);user-select:none}
  .chip .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .chip.off{opacity:.32;text-decoration:line-through}
  .btn{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer}
  .btn:hover{border-color:var(--line-2)}
  main{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.drag{cursor:grabbing}
  aside{position:absolute;top:14px;right:14px;width:330px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow-y:auto;
    background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
  aside.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-3);font-size:13px;padding:22px}
  .n-type{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px}
  .n-type .dot{width:9px;height:9px;border-radius:2px}
  .n-label{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px;word-break:break-word}
  .n-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .n-meta .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);margin-right:5px;display:inline-block;vertical-align:-2px}
  .rel{border-top:1px solid var(--line);padding:12px 0 2px}
  .rel h4{margin:0 0 9px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
  .rel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .rel li{font-family:var(--mono);font-size:11.5px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer}
  .rel li:hover{border-color:var(--sel);background:var(--chip)}
  .hint{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);pointer-events:none}
  .tip{position:absolute;pointer-events:none;font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--bg);padding:3px 7px;border-radius:5px;transform:translate(-50%,-160%);white-space:nowrap;opacity:0}
</style>
</head>
<body>
<header>
  <a class="back" href="./index.html">← 2one · Astryx</a>
  <div class="title">2one × Astryx<span class="sub">knowledge graph</span></div>
  <div class="stats" id="stats"></div>
  <div class="grow"></div>
  <input class="search" id="search" placeholder="find element…" autocomplete="off" spellcheck="false" />
  <div class="chips" id="chips"></div>
  <button class="btn" id="reset">Reset</button>
  <button class="btn" id="theme">◐</button>
</header>
<main>
  <canvas id="c"></canvas>
  <aside class="empty" id="panel">Click any node to see its context — what it’s composed of, what uses it, what governs it.</aside>
  <div class="hint">drag to pan · scroll to zoom · click a node</div>
  <div class="tip" id="tip"></div>
</main>
<script type="module" src="./graph-main.ts"></script>
</body>
</html>
